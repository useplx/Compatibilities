name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    manifests:
        runs-on: ubuntu-24.04
        env:
            CC: gcc-14
            CXX: g++-14
        steps:
            - uses: actions/checkout@v4
              with:
                  path: Compatibilities
            - uses: actions/checkout@v4
              with:
                  repository: useplx/SYNaPSe
                  path: SYNaPSe
            - uses: actions/checkout@v4
              with:
                  repository: useplx/MyeLiN
                  path: MyeLiN
                  submodules: recursive
            - uses: actions/checkout@v4
              with:
                  repository: useplx/Quantizations
                  path: Quantizations
            - name: Install build tools
              run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build
            - name: Build SYNaPSe
              run: |
                  cmake -S SYNaPSe -B build -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DMLN_ROOT=${{ github.workspace }}/MyeLiN \
                    -DPLEX_QUANTIZATIONS_ROOT=${{ github.workspace }}/Quantizations
                  cmake --build build --target synps --parallel 2
            - name: Validate compatibility package graphs
              run: |
                  for package in Adreno643 CUDA LLVM Vulkan; do
                    build/synps graph \
                      --project "Compatibilities/${package}/synps.toml"
                  done
                  QAIRT_ROOT="${RUNNER_TEMP}/qairt-placeholder" \
                    build/synps graph \
                      --project Compatibilities/QNN/synps.toml

    qnn-source:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Verify proprietary SDK isolation
              run: |
                  test ! -e QNN/runtime
                  ! git ls-files | grep -E '(^|/)(libQnn|libQairt|QnnHtp|SnpeHtp)'
                  grep -Fq 'QAIRT_ROOT' QNN/synps.toml
